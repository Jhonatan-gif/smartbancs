# Balanceador de carga para las réplicas de core-api (Docker resuelve "core-api" a la IP de cada réplica).
upstream core_api {
    server core-api:3000 max_fails=0;
    keepalive 256;                      # reutiliza conexiones hacia las réplicas
}

server {
    listen 3000;

    location / {
        proxy_pass http://core_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_connect_timeout 1s;
        proxy_read_timeout 10s;
        proxy_next_upstream off;        # NUNCA reintentar una transferencia en otra réplica (la idempotencia la decide el cliente)
    }
}
