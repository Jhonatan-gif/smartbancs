# Sirve la interfaz estática y reenvía /api/* a core-api: el navegador solo habla con un origen (no hace falta CORS).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad. La CSP no admite scripts ni estilos en línea: todo sale de archivos propios.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # DNS interno de Docker: se vuelve a resolver core-api si su contenedor se recrea (no se queda con una IP vieja)
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $core_api http://core-api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $core_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_next_upstream off;          # nunca reintentar una transferencia por su cuenta
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
