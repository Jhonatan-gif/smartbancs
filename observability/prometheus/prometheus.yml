# Prometheus: recoge métricas cada 15 s y evalúa las reglas de alerta.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: core-api
    metrics_path: /metrics
    static_configs: [{ targets: ["core-api:3000"] }]
  - job_name: worker
    metrics_path: /metrics
    static_configs: [{ targets: ["worker:9464"] }]
  - job_name: ai-service
    metrics_path: /metrics
    static_configs: [{ targets: ["ai-service:8000"] }]
  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
