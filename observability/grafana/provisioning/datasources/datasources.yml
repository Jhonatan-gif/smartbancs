apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData: { timeInterval: 15s }
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Cada log con "trace_id":"<32 hex>" muestra un enlace directo a su traza en Tempo
      derivedFields:
        - name: TraceID
          datasourceUid: tempo
          matcherRegex: '"trace_id":"([0-9a-f]{32})"'
          url: '$${__value.raw}'
          urlDisplayLabel: Ver traza
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # Desde una traza se saltan a los logs de esa misma traza en Loki
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "2m"
        tags:
          - { key: service.name, value: service }
      nodeGraph: { enabled: true }
      # Búsquedas TraceQL por HTTP (no por streaming): más simple y permite consultarlas por la API de Grafana
      streamingEnabled: { search: false, metrics: false }
