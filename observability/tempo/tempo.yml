# Tempo (trazas) en modo "single binary" con almacenamiento local. Recibe OTLP/HTTP en el puerto 4318.
stream_over_http_enabled: true
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
compactor:
  compaction:
    block_retention: 168h   # 7 días
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
