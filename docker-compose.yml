# SmartBancs - entorno de desarrollo.  Un solo comando:  docker compose up --build
name: smartbancs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartbancs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartbancs}
      POSTGRES_DB: ${POSTGRES_DB:-smartbancs}
    # Parámetros pensados para diagnosticar el incidente de la sección 3.5:
    #  - deadlock_timeout bajo: los deadlocks se detectan en 0.5 s
    #  - log_lock_waits: registra las esperas de bloqueo
    #  - log_min_duration_statement: registra las consultas lentas
    command: >
      postgres
      -c max_connections=200
      -c deadlock_timeout=500ms
      -c log_lock_waits=on
      -c log_min_duration_statement=200
    ports:
      # Configurable por si el puerto 5432 ya está ocupado por un PostgreSQL local
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Se ejecutan en orden alfabético solo la primera vez (volumen vacío)
      - ./db/migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./db/seeds/001_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
      - ./db/migrations/002_bancs_sync.sql:/docker-entrypoint-initdb.d/003_bancs_sync.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartbancs} -d ${POSTGRES_DB:-smartbancs}"]
      interval: 3s
      timeout: 3s
      retries: 20

  core-api:
    build: ./services/core-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-smartbancs}:${POSTGRES_PASSWORD:-smartbancs}@postgres:5432/${POSTGRES_DB:-smartbancs}
      LOCK_ORDERING: ${LOCK_ORDERING:-on}
      SIMULATED_LOCK_DELAY_MS: ${SIMULATED_LOCK_DELAY_MS:-0}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # El ai-service es OPCIONAL para core-api: no hay depends_on. Si cae, /recommendations responde el fallback.
      AI_SERVICE_URL: http://ai-service:8000
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-300}
      # Trazas OpenTelemetry (OTLP/HTTP). Sin el perfil obs no hay Tempo y simplemente se descartan.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # appendonly: los eventos en Redis Streams sobreviven a un reinicio
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Core bancario legado SIMULADO: lento, con límite de tasa y con fallos aleatorios.
  bancs-mock:
    build: ./services/bancs-mock
    environment:
      PORT: 4000
      BANCS_LATENCY_MIN_MS: ${BANCS_LATENCY_MIN_MS:-200}
      BANCS_LATENCY_MAX_MS: ${BANCS_LATENCY_MAX_MS:-600}
      BANCS_MAX_RPS: ${BANCS_MAX_RPS:-10}
      BANCS_MAX_CONCURRENCY: ${BANCS_MAX_CONCURRENCY:-5}
      BANCS_FAILURE_RATE: ${BANCS_FAILURE_RATE:-0.1}
      BANCS_LOST_RESPONSE_RATE: ${BANCS_LOST_RESPONSE_RATE:-0.05}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Publica los eventos del outbox y sincroniza con Bancs (lotes + rate limit + circuit breaker).
  worker:
    build: ./services/worker
    # Si el proceso muere por algo inesperado, vuelve a levantarse solo
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bancs-mock:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-smartbancs}:${POSTGRES_PASSWORD:-smartbancs}@postgres:5432/${POSTGRES_DB:-smartbancs}
      REDIS_URL: redis://redis:6379
      BANCS_URL: http://bancs-mock:4000
      BANCS_BATCH_SIZE: ${BANCS_BATCH_SIZE:-25}
      BANCS_MAX_CALLS_PER_SEC: ${BANCS_MAX_CALLS_PER_SEC:-5}
      BREAKER_THRESHOLD: ${BREAKER_THRESHOLD:-5}
      BREAKER_COOLDOWN_MS: ${BREAKER_COOLDOWN_MS:-5000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_PORT: 9464
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
    ports:
      - "9464:9464"   # /metrics y /health del worker
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9464/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Recomendaciones de IA (FastAPI). Consume el stream con su propio grupo (`ai-recs`) y NO participa en las
  # transferencias: si cae o se vuelve lento, core-api responde recomendaciones de respaldo (fallback).
  ai-service:
    build: ./services/ai-service
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./etl/data:/data:ro   # features del ETL (processed/ si existe; si no, la muestra versionada)
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ETL de transacciones (Python). No arranca con `docker compose up`: se ejecuta bajo demanda con
  #   docker compose run --rm etl              (limpia el CSV de muestra -> etl/data/processed)
  #   docker compose run --rm etl python -m pytest -q
  etl:
    build: ./etl
    profiles: ["etl"]
    volumes:
      - ./etl/data:/app/data

  # ===================== OBSERVABILIDAD (perfil "obs") =====================
  #   docker compose --profile obs up -d --build
  # Grafana: http://localhost:3001 (dashboards en la carpeta SmartBancs) · Prometheus: http://localhost:9090
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["obs"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Métricas internas de PostgreSQL: deadlocks, bloqueos, sesiones y transacciones largas
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    profiles: ["obs"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-smartbancs}:${POSTGRES_PASSWORD:-smartbancs}@postgres:5432/${POSTGRES_DB:-smartbancs}?sslmode=disable

  loki:
    image: grafana/loki:3.3.2
    profiles: ["obs"]
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - lokidata:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Trazas distribuidas (recibe OTLP/HTTP de core-api y worker)
  tempo:
    image: grafana/tempo:2.6.1
    profiles: ["obs"]
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempodata:/var/tempo
    ports:
      - "3200:3200"

  # Recoge los logs de todos los contenedores del proyecto y los manda a Loki
  alloy:
    image: grafana/alloy:v1.5.1
    profiles: ["obs"]
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["obs"]
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Solo entorno de desarrollo: lectura de dashboards sin iniciar sesión
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/operacion.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
  promdata:
  lokidata:
  grafanadata:
  tempodata:
